name: EnergyCore
version: '${version}'
main: com.ydxc20091.energycore.EnergyCorePlugin
api-version: '1.21'
folia-supported: true
authors: [ydxc20091]
description: Transactional energy API and CraftEngine 26.10 integration.
dependencies:
  server:
    CraftEngine:
      load: BEFORE
      required: true
      join-classpath: true
permissions:
  energycore.admin:
    description: Inspect and configure EnergyCore.
    default: op
